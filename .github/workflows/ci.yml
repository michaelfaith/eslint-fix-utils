name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

permissions: {}

jobs:
  actions_security:
    name: GitHub Actions Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - parallel:
          - name: Verify Workflow Lockfile
            run: |
              gh extension install github/gh-actions-lock
              gh actions-lock --verify
            env:
              GH_TOKEN: ${{ github.token }}
          - name: Run Zizmor
            uses: zizmorcore/zizmor-action@v0.9.2
            with:
              advanced-security: 'false'
              annotations: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm build
      - run: node dist/index.mjs

  dedupe_check:
    name: Dedupe Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm dedupe --check --prefer-offline

  engines_check:
    name: Engines Check (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.13.0
          - 22
          - 24.0.0
          - 24
          - 26
    steps:
      - uses: $/.github/actions/setup
        with:
          install-flags: --prod --engine-strict --ignore-scripts
          node-version: ${{ matrix.node-version }}

  format_check:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm format --list-different

  knip:
    name: Knip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm knip

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm run test --coverage
      - uses: codecov/codecov-action@v7.1.1
        with:
          fail_ci_if_error: true
          use_oidc: true

  type_check_current:
    name: Type Check (ESLint 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm typecheck

  type_check_legacy:
    name: Type Check (ESLint ${{ matrix.eslint-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        eslint-version:
          - 9
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm install -D eslint@${{ matrix.eslint-version }}
      - run: pnpm typecheck --project tsconfig.prod.json
