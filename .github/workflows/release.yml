name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}

jobs:
  release_please:
    name: Manage Release PR
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Create Token
        id: create_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.FAITHBOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.FAITHBOT_APP_PRIVATE_KEY }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/release-please-manifest.json
          token: ${{ steps.create_token.outputs.token }}

  publish:
    name: Publish Package
    if: ${{ needs.release_please.outputs.releases_created == 'true' }}
    needs: release_please
    permissions:
      contents: read
      id-token: write # Required for OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - name: Build and Publish
        run: |
          pnpm build
          pnpm publish

  post_release:
    name: Post Release Comments
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: echo "npm_version=$(npm pkg get version | tr -d '"')" >> "$GITHUB_ENV"
      - uses: apexskier/github-release-commenter@v1.4.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :tada: This is included in version {release_link} :tada:

            The release is available on:

            * [GitHub releases](https://github.com/michaelfaith/eslint-fix-utils/releases/tag/{release_tag})
            * [npm package (@latest dist-tag)](https://www.npmjs.com/package/eslint-fix-utils/v/${{ env.npm_version }})

            Cheers! 📦🚀
